  <style>
    
    :root {
      --bg: #ffffff;
      --panel: #f3f3f3;
      --line: #e8e8e8;
      --text: #1b191c;
      --muted: #898989;
      --blue: #4a5f80;
      --brand: #1b191c;

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
    body {
      font: 16px/1.45 "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;

    a { color: var(--blue); }

    
    .site-header { padding: 20px 20px 0; box-sizing: border-box; }

      margin: 0 auto;
      padding: 14px 20px;

      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);

    .site-nav .brand {
      font-weight: 500;
      letter-spacing: -0.04em;
      font-size: 18px;
      color: var(--text);
      text-decoration: none;
    }
    .site-nav .brand span { color: var(--blue); font-weight: 400; }
    .site-nav .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 22px;
    }
    .site-nav .links a {
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .site-nav .links a:hover { opacity: 0.7; }
    .site-nav .links a[aria-current="page"] { color: var(--blue); }
    .site-nav .nav-end { justify-self: end; }
    .site-nav .nav-cta {
      display: inline-block;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      border-radius: 16px;
      padding: 10px 14px 9px;
      font-size: 14px;
      font-weight: 500;
    }
    .site-nav .nav-cta:hover { background: #1b191c; color: #fff; }
    .prose { max-width: 820px; margin: 0 auto; padding: 48px 24px 80px; }
    .prose h1 { font-size: clamp(36px, 6vw, 64px); font-weight: 400; letter-spacing: -0.04em; line-height: 0.96; margin: 12px 0 16px; }
    .prose h2 { font-size: clamp(22px, 3vw, 36px); font-weight: 400; letter-spacing: -0.03em; margin: 40px 0 14px; }
    .prose h3 { font-size: 22px; font-weight: 400; letter-spacing: -0.03em; margin: 28px 0 10px; }
    .prose p, .prose li { color: var(--text); font-size: 17px; line-height: 1.45; }
    .prose em { color: var(--muted); }
    .prose code, .prose pre {
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 13px;
    }
    .prose code {
      background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
      padding: 1px 5px;
    }
    .prose pre {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px 18px; overflow-x: auto;
    }
    .prose pre code { background: none; border: 0; padding: 0; }
    .prose table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin: 16px 0 24px; }
    .prose th, .prose td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .prose th { color: var(--muted); font-size: 12px; letter-spacing: -0.02em; font-weight: 500; }
    .prose ul, .prose ol { padding-left: 1.2em; }
    .prose li { margin: 8px 0; }
    .prose hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0; }
    .kicker { color: var(--blue); letter-spacing: 0.02em; font-size: 13px; font-weight: 500; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 13px; }
    .prose .kicker { color: var(--blue); }
    @media (max-width: 700px) {
      .site-nav { display: flex; flex-wrap: wrap; width: auto; }
      .site-nav .links { width: 100%; justify-content: flex-start; }
      .site-nav .nav-end { display: none; }
