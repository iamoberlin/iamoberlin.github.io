<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solomon — 01R</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b12;
      --panel: #0e1624;
      --line: #1c2a40;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --blue: #4c8dff;
      --brand: #004386;
      --fire: #f5a524;
      --high: #ff5d5d;
      --ok: #3dd68c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body { font: 15px/1.5 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
    a { color: var(--blue); }
    
    .site-nav {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      max-width: 960px; margin: 0 auto; padding: 16px 20px 0;
    }
    .site-nav .brand {
      font-weight: 700; letter-spacing: 0.08em; font-size: 12px; text-transform: uppercase;
      color: var(--text); text-decoration: none;
    }
    .site-nav .brand span { color: var(--blue); }
    .site-nav .links { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .site-nav a { color: var(--muted); text-decoration: none; font-size: 13px; }
    .site-nav a:hover { color: var(--text); }
    .site-nav a[aria-current="page"] { color: var(--blue); }
    .prose { max-width: 960px; margin: 0 auto; padding: 12px 20px 64px; }
    .prose h1 { font-size: 28px; letter-spacing: -0.03em; margin: 12px 0 8px; }
    .prose h2 { font-size: 18px; margin: 28px 0 10px; }
    .prose h3 { font-size: 15px; margin: 22px 0 8px; color: var(--text); }
    .prose p, .prose li { color: var(--text); }
    .prose em { color: var(--muted); }
    .prose code, .prose pre {
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 13px;
    }
    .prose code {
      background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
      padding: 1px 5px;
    }
    .prose pre {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 14px 16px; overflow-x: auto;
    }
    .prose pre code { background: none; border: 0; padding: 0; }
    .prose table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; margin: 12px 0 20px; }
    .prose th, .prose td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .prose th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
    .prose ul, .prose ol { padding-left: 1.2em; }
    .prose li { margin: 6px 0; }
    .prose hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
    .kicker { color: var(--blue); letter-spacing: 0.14em; font-size: 11px; text-transform: uppercase; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 13px; }
    .prose .kicker { color: var(--blue); letter-spacing: 0.14em; font-size: 11px; text-transform: uppercase; }
    @media (max-width: 700px) {
      .site-nav { flex-direction: column; align-items: flex-start; }
    }

    
    .kicker { color: var(--blue); letter-spacing: 0.14em; font-size: 11px; text-transform: uppercase; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
    .hero-block { max-width: 960px; margin: 0 auto; padding: 28px 20px 8px; }
    .hero-block h1 { font-size: 34px; letter-spacing: -0.04em; margin: 8px 0 10px; }
    .hero-block .lede { color: var(--muted); font-size: 17px; max-width: 40em; }
    .cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 8px; }
    .btn {
      display: inline-block; padding: 10px 14px; border-radius: 8px;
      text-decoration: none; font-weight: 600; font-size: 14px;
    }
    .btn.primary { background: #13315c; color: var(--text); border: 1px solid #2a4d80; }
    .btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 22px 0; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    .stat .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
    .stat .val { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 20px; margin-top: 4px; }
    .stat .val.high { color: var(--high); }
    .stat .val.fire { color: var(--fire); }
    .banner {
      background: #2a1114; border: 1px solid #5a1e24; border-radius: 10px;
      padding: 16px 18px; margin: 8px 0 0;
    }
    .banner.ok { background: #0f2319; border-color: #1d4a33; }
    .banner strong.high { color: var(--high); }
    .banner strong.ok { color: var(--ok); }
    .section { max-width: 960px; margin: 0 auto; padding: 12px 20px 8px; }
    .section h2 { font-size: 16px; margin: 20px 0 10px; }
    .signals { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    .signal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .signal .id { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12px; color: var(--blue); }
    .signal p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
    .card {
      display: block; background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 14px 16px; text-decoration: none; color: inherit;
    }
    .card:hover { border-color: #2d4568; }
    .card .idx { color: var(--blue); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .card h3 { margin: 4px 0 0; font-size: 15px; }
    .card .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
    .tag.high { color: var(--high); border-color: #5a1e24; }
    .tag.ok { color: var(--ok); border-color: #1d4a33; }
    .foot { max-width: 960px; margin: 0 auto; padding: 28px 20px 64px; color: var(--muted); font-size: 12px; }
  
  </style>
</head>

    <div class="links">

      <a href="../research/index.html">Research</a>

    </div>

      <div class="kicker">solomon</div>
      <h1>Solomon</h1>
      <p>ownership-coin · live · token SOLO</p>

    </div>
</body>
</html>
